listen: ":8080"

commands:
  proxy-sync:
    cmd: |
      exec 9>/tmp/proxy-sync.lock
      flock 9

      if [ ! -d /data/repo/.git ]; then
        git clone --depth 1 https://github.com/purple4pur/proxy-config-updater.git /data/repo
      fi

      git -C /data/repo fetch --prune origin
      git -C /data/repo reset --hard origin/master
      test "$(git -C /data/repo rev-parse HEAD)" = "$(git -C /data/repo rev-parse origin/master)"

      for f in /data/repo/out/*; do
        name="$(basename "$f")"
        tmp="/out/<proxy-dir>/.${name}.tmp.$$"
        cp "$f" "$tmp"
        chmod 644 "$tmp"
        mv -f "$tmp" "/out/<proxy-dir>/${name}"
      done

      tmp="/out/dashboard/.index.html.tmp.$$"
      cp /data/repo/out/index.html "$tmp"
      chmod 644 "$tmp"
      mv -f "$tmp" /out/dashboard/index.html

      . /run/secrets/cloudflare.env
      purge="$(curl -fsS -X POST \
        "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
        -H 'Content-Type: application/json' \
        -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
        -d '{"prefixes":["static.quitw.org/dashboard","static.quitw.org/<proxy-dir>/"]}')"
      printf '%s\n' "$purge"
      printf '%s' "$purge" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'

      printf 'synced %s\n' "$(git -C /data/repo rev-parse HEAD)"
    timeout: 120s

  proxy-status:
    cmd: |
      git -C /data/repo rev-parse --short HEAD
      git -C /data/repo log -1 --pretty='%ci %s'
    timeout: 10s
